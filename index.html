<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KRKREE 的个人导航页：QQ、微信、Bilibili、Bangumi 等入口。"
    />
    <title>KRKREE | Personal Console</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body data-theme="code">
    <canvas class="network-field" aria-hidden="true"></canvas>
    <div class="cursor-aura" aria-hidden="true"></div>

    <div class="theme-rail" aria-label="视觉模式">
      <button class="theme-button is-active" type="button" data-theme-choice="code" title="代码">
        <i data-lucide="terminal" aria-hidden="true"></i>
      </button>
      <button class="theme-button" type="button" data-theme-choice="aurora" title="流光">
        <i data-lucide="sparkles" aria-hidden="true"></i>
      </button>
      <button class="theme-button" type="button" data-theme-choice="minimal" title="极简">
        <i data-lucide="circle" aria-hidden="true"></i>
      </button>
    </div>

    <main class="site-shell">
      <section class="hero" aria-labelledby="site-title">
        <div class="profile-lockup">
          <button class="avatar-frame" type="button" id="avatarButton" title="Ping">
            <span class="avatar-ring" aria-hidden="true"></span>
            <span class="avatar-core">K</span>
          </button>

          <div class="headline">
            <p class="eyebrow">PERSONAL CONSOLE</p>
            <h1 id="site-title" data-text="KRKREE">KRKREE</h1>
            <p class="subtitle">链接、账号与作品入口。</p>
          </div>
        </div>

        <div class="hero-panel">
          <div class="status-grid" aria-label="站点状态">
            <div>
              <span class="status-label">MODE</span>
              <strong id="modeLabel">CODE</strong>
            </div>
            <div>
              <span class="status-label">LINKS</span>
              <strong>04</strong>
            </div>
            <div>
              <span class="status-label">BUILD</span>
              <strong>STATIC</strong>
            </div>
          </div>

          <div class="terminal-card" aria-label="交互终端">
            <div class="terminal-top">
              <span></span>
              <span></span>
              <span></span>
              <p>krkree.local</p>
            </div>
            <pre id="terminalOutput" aria-live="polite"></pre>
            <div class="command-row" id="commandRow"></div>
          </div>
        </div>
      </section>

      <section class="link-grid" id="contactGrid" aria-label="个人导航链接"></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="qr-modal" id="qrModal" aria-hidden="true">
      <div class="qr-panel" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
        <button class="qr-close" type="button" id="qrClose" title="关闭">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
        <p class="eyebrow">SCAN NODE</p>
        <h2 id="qrTitle">二维码</h2>
        <img id="qrImage" src="" alt="" />
        <p id="qrText"></p>
      </div>
    </div>
  </body>
</html>
